# Render Blueprint — SABO Backend (free web service)
# Dashboard: New + -> Blueprint -> select this repo, Render reads this file.
# Root Directory must stay empty (repo root) since this is an npm workspace.
services:
  - type: web
    name: sabo-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm ci --workspace=backend --include-workspace-root && npm run build:backend
    startCommand: cd backend && (npx prisma db push --accept-data-loss || echo "schema push skipped") && (npx ts-node prisma/seed.ts || echo "seed skipped") && node dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
