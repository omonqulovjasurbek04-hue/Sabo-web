/* ---------- 3. HOLAT (state) ---------- */
let LANG = localStorage.getItem('sabo-lang') || 'uz';
let CART = JSON.parse(localStorage.getItem('sabo-cart') || '{}');
let FILTER = {cat:'all', q:''};

const t = () => DICTS[LANG];
const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const img = p => IMG_BASE + p.image;
const price = n => new Intl.NumberFormat('ru-RU').format(n);
const money = n => price(n) + ' ' + t().cart.currency;

function saveCart(){ localStorage.setItem('sabo-cart', JSON.stringify(CART)); updateBadge(); }
function cartCount(){ return Object.values(CART).reduce((a,b)=>a+b,0); }
function updateBadge(){
  const n = cartCount(), b = $('#cart-badge');
  if(!n){ b.classList.add('hidden'); return; }
  b.textContent = n > 99 ? '99+' : n;
  b.classList.remove('hidden');
}
function toast(msg){
  $('#toast-text').textContent = msg;
  const el = $('#toast');
  el.classList.remove('hidden');
  clearTimeout(toast._tm);
  toast._tm = setTimeout(()=>el.classList.add('hidden'), 2200);
}

function productCard(p){
  return `
  <a href="#/products/${p.slug}" class="card-hover group bg-surface border border-line rounded-2xl overflow-hidden flex flex-col">
    <div class="aspect-square overflow-hidden bg-white">
      <img src="${img(p)}" alt="${esc(p.name[LANG])}" loading="lazy"
           class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
    </div>
    <div class="p-4 flex flex-col gap-2 flex-1">
      <div class="flex flex-wrap gap-1.5">
        ${(p.badges||[]).slice(0,1).map(b=>`<span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-mint text-brand">${esc(b[LANG])}</span>`).join('')}
        ${p.fat?`<span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-softblue text-brand">${esc(p.fat)}</span>`:''}

/* ---------- 6. VALIDATSIYA ---------- */
const RE_PHONE = /^\+?[\d\s\-()]{7,}$/;
const RE_EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function setErr(input, msg){
  const err = input.parentElement.querySelector('.err');
  if(msg){ err.textContent = msg; err.classList.remove('hidden'); input.classList.add('border-sabo'); }
  else{ err.classList.add('hidden'); input.classList.remove('border-sabo'); }
  return !msg;
}

function bindForms(root){
  // Aloqa formasi — FAQAT tekshiruv, backend yo'q (soxta muvaffaqiyat ko'rsatilmaydi)
  const cf = root.querySelector('#contact-form');
  if(cf){
    cf.addEventListener('submit', e=>{
      e.preventDefault();
      const v = t().contact.validation;
      let ok = true;
      ok = setErr($('#cf-name'),  $('#cf-name').value.trim()  ? '' : v.required) && ok;
      ok = setErr($('#cf-phone'), RE_PHONE.test($('#cf-phone').value.trim()) ? '' : v.phone) && ok;
      ok = setErr($('#cf-email'), RE_EMAIL.test($('#cf-email').value.trim()) ? '' : v.email) && ok;
      ok = setErr($('#cf-message'), $('#cf-message').value.trim() ? '' : v.required) && ok;
      if(ok) $('#cf-result').classList.remove('hidden');
    });
  }
  // Buyurtma formasi — FAQAT tekshiruv, buyurtma saqlanmaydi/yuborilmaydi
  const co = root.querySelector('#checkout-form');
  if(co){
    co.addEventListener('submit', e=>{
      e.preventDefault();
      const v = t().contact.validation;
      let ok = true;
      ok = setErr($('#co-name'),  $('#co-name').value.trim()  ? '' : v.required) && ok;
      ok = setErr($('#co-phone'), RE_PHONE.test($('#co-phone').value.trim()) ? '' : v.phone) && ok;
      ok = setErr($('#co-address'), $('#co-address').value.trim() ? '' : v.required) && ok;
      if(ok){
        const res = $('#co-result');
        res.textContent = t().checkout.notSent;
        res.classList.remove('hidden');
      }
    });
  }
}

/* ---------- 7. MAHSULOTLAR FILTRI ---------- */
function applyFilter(){
  const grid = $('#products-grid'), none = $('#no-results'), cnt = $('#result-count');
  if(!grid) return;
  const d = t();
  const q = FILTER.q.toLowerCase();
  const list = PRODUCTS.filter(p =>
    (FILTER.cat==='all' || p.category===FILTER.cat) &&
    (!q || p.name.uz.toLowerCase().includes(q) || p.name.ru.toLowerCase().includes(q) || p.name.en.toLowerCase().includes(q))
  );
  cnt.textContent = `${list.length} ${d.productsPage.count}`;
  none.classList.toggle('hidden', list.length>0);
  grid.innerHTML = list.map(productCard).join('');
}

function bindProductsPage(){
  const inp = $('#search-input');
  if(!inp) return;
  inp.addEventListener('input', ()=>{ FILTER.q = inp.value; applyFilter(); });
  document.querySelectorAll('#filter-chips [data-cat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      FILTER.cat = btn.dataset.cat;
      document.querySelectorAll('#filter-chips [data-cat]').forEach(b=>{
        const active = b.dataset.cat===FILTER.cat;
        b.className = `chip whitespace-nowrap px-4 py-2.5 rounded-xl border text-sm font-medium transition-colors ${active?'bg-brand text-white border-brand':'bg-surface border-line text-mut hover:border-brand hover:text-brand'}`;
      });
      history.replaceState(null,'',`#/products${FILTER.cat!=='all'?`?cat=${FILTER.cat}`:''}`);
      applyFilter();
    });
  });
  applyFilter();
}

/* ---------- 8. STATIK MATNLAR (header/footer) ---------- */
const NAV_ROUTES = [
  ['#/', 'home'], ['#/products','products'], ['#/production','production'],
  ['#/about','about'], ['#/certificates','certificates'], ['#/blog','blog'], ['#/contact','contact']
];

function applyStatic(){
  const d = t();
  document.documentElement.lang = LANG;
  document.title = LANG==='uz' ? 'SABO — Sut mahsulotlari' : LANG==='ru' ? 'SABO — Молочные продукты' : 'SABO — Dairy Products';
  $('#logo-tagline').textContent = d.tagline;

  const links = NAV_ROUTES.map(([href,key])=>{
    const route = location.hash.split('?')[0] || '#/';
    const active = href==='#/' ? route==='#/' : route.startsWith(href);
    return `<a href="${href}" class="${active?'text-brand font-semibold':'hover:text-brand'} transition-colors">${esc(d.nav[key])}</a>`;
  });
  $('#desktop-nav').innerHTML = links.join('');
  $('#mobile-nav').innerHTML =
    `<select id="lang-select-m" class="sm:hidden mb-3 w-full bg-surface border border-line rounded-lg px-2 py-2.5 text-sm outline-none">
       <option value="uz" ${LANG==='uz'?'selected':''}>UZ</option><option value="ru" ${LANG==='ru'?'selected':''}>RU</option><option value="en" ${LANG==='en'?'selected':''}>EN</option>
     </select>` +
    `<nav class="grid gap-1">${links.map(l=>`<div class="py-2 border-b border-line last:border-0">${l.replace('transition-colors','transition-colors block')}</div>`).join('')}</nav>`;
  $('#mobile-nav').querySelector('#lang-select-m').addEventListener('change', e=>setLang(e.target.value));

  $('#footer-desc').textContent = d.footer.description;
  $('#footer-nav-title').textContent = d.footer.navTitle;
  $('#footer-contact-title').textContent = d.footer.contactTitle;
  $('#footer-contact-note').textContent = d.contact.infoNote;
  $('#footer-rights').textContent = d.footer.rights;
  $('#footer-year').textContent = new Date().getFullYear();
  $('#footer-nav').innerHTML = NAV_ROUTES.slice(1).map(([href,key])=>`<a href="${href}" class="hover:text-brand transition-colors">${esc(d.nav[key])}</a>`).join('');
  $('#lang-select').value = LANG;
}

function setLang(l){
  LANG = l;
  localStorage.setItem('sabo-lang', l);
  applyStatic(); render();
}

/* ---------- 9. ROUTER ---------- */
function parseHash(){
  const raw = location.hash.replace(/^#/,'') || '/';
  const [pathPart, queryPart] = raw.split('?');
  return { path:'/'+pathPart.replace(/^\/+/,''), query:new URLSearchParams(queryPart||'') };
}

function render(){
  const {path, query} = parseHash();
  const app = $('#main');
  let html;

  if(path==='/' )                       html = PAGES.home();
  else if(path==='/products')           { html = PAGES.products(query); }
  else if(path.startsWith('/products/'))html = PAGES.productDetail(decodeURIComponent(path.split('/')[2]));
  else if(path==='/production')         html = PAGES.production();
  else if(path==='/about')              html = PAGES.about();
  else if(path==='/certificates')       html = PAGES.certificates();
  else if(path==='/blog')               html = PAGES.blog();
  else if(path==='/contact')            html = PAGES.contact();
  else if(path==='/cart')               html = PAGES.cart();
  else if(path==='/checkout')           html = PAGES.checkout();
  else                                  html = PAGES.notFound();

  app.innerHTML = html;
  window.scrollTo({top:0});
  bindForms(app);
  bindProductsPage();
  applyStatic(); // aktiv navigatsiya holatini yangilash
}

/* ---------- 10. GLOBAL HODISALAR ---------- */
document.addEventListener('click', e=>{
  const add = e.target.closest('[data-add]');
  if(add){
    const id = add.dataset.add;
    CART[id] = (CART[id]||0)+1;
    saveCart();
    toast(t().product.addToCart + ' ✓');
    return;
  }
  const addDetail = e.target.closest('[data-add-detail]');
  if(addDetail){
    const id = addDetail.dataset.addDetail;
    const qtyEl = $('#detail-qty');
    const qty = Math.max(1, parseInt(qtyEl.textContent)||1);
    CART[id] = (CART[id]||0)+qty;
    saveCart();
    toast(t().product.addToCart + ' ✓');
    return;
  }
  const qtyBtn = e.target.closest('.qty-btn');
  if(qtyBtn){
    const el = $('#detail-qty');
    el.textContent = Math.max(1,(parseInt(el.textContent)||1)+parseInt(qtyBtn.dataset.qty));
    return;
  }
  const inc = e.target.closest('[data-cart-inc]');
  if(inc){ CART[inc.dataset.cartInc]++; saveCart(); render(); return; }
  const dec = e.target.closest('[data-cart-dec]');
  if(dec){
    const id = dec.dataset.cartDec;
    CART[id]--;
    if(CART[id]<=0) delete CART[id];
    saveCart(); render(); return;
  }
  const del = e.target.closest('[data-cart-del]');
  if(del){ delete CART[del.dataset.cartDel]; saveCart(); render(); return; }

  if(e.target.closest('#theme-btn')){
    const dark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('sabo-theme', dark?'dark':'light');
  }
  if(e.target.closest('#menu-btn')){
    $('#mobile-nav').classList.toggle('hidden');
  }
  if(e.target.closest('#mobile-nav a')){
    $('#mobile-nav').classList.add('hidden');
  }
});

$('#lang-select').addEventListener('change', e=>setLang(e.target.value));
window.addEventListener('hashchange', render);

/* ---------- START ---------- */
updateBadge();
render();
</script>
