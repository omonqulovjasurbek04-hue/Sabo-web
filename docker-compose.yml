services:
  postgres:
    image: postgres:16-alpine
    container_name: sabo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sabo_db
    ports:
      - "5432:5432"
    volumes:
      - sabo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sabo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sabo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sabo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: sabo_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - sabo_minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: sabo_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    volumes:
      - sabo_mailpit_data:/data

volumes:
  sabo_postgres_data:
  sabo_redis_data:
  sabo_minio_data:
  sabo_mailpit_data:
